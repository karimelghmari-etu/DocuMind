spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/documind}
spring.datasource.username=${DB_USERNAME:documind}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

app.storage.location=./uploads

app.llm.provider=groq
app.llm.groq.model=qwen/qwen3.8-27b
app.llm.groq.url=https://api.groq.com/openai/v1/chat/completions
app.llm.groq.api-key=${GROQ_API_KEY}

app.llm.ollama.url=http://localhost:11434/v1/chat/completions
app.llm.ollama.model=qwen2.5:7b-instruct

app.llm.claude.model=claude-opus-5-5
app.llm.claude.api-key=${ANTHROPIC_API_KEY:}

app.chunking.size=500
app.chunking.overlap=100

app.rag.top-k=5
app.rag.min-score=0.2

app.chat.history-size=6

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8081
# Dates and month names in English, whatever language the browser asks for.
spring.web.locale=en
spring.web.locale-resolver=fixed
