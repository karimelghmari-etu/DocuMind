# H2 file-based DB for local dev (survives restarts). Switch back to PostgreSQL later:
# spring.datasource.url=jdbc:postgresql://localhost:5432/documind_db
# spring.datasource.username=postgres
# spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:h2:file:./data/documind_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
jwt.secret=${JWT_SECRET}
logging.level.org.springframework.security=TRACE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080