<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind | File too large</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/documents.css}">
    <style>
        .too-large-page {
            max-width: 520px;
            margin: 12vh auto;
            padding: 0 16px;
            text-align: center;
        }
        .too-large-page a {
            display: inline-block;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<!--
    Shown by Spring Boot for HTTP 413 on browser requests.
    A too-large upload is rejected by Tomcat before any DocuMind controller runs,
    so this page replaces the red flash message used for other upload errors.
-->
<main class="too-large-page">
    <h1>File too large</h1>
    <p class="error-message" role="alert">
        The file exceeds the maximum upload size. Please choose a smaller file.
    </p>
    <a th:href="@{/documents}">← Back to My Documents</a>
</main>
</body>
</html>
