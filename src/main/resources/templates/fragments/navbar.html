
<header class="topbar" th:fragment="navbar">

    <div class="topbar-left">
        <div class="breadcrumb">
            <span>Workspace</span>
            <span class="breadcrumb-separator">/</span>
            <strong th:text="${currentPage}">Dashboard</strong>
        </div>
    </div>

    <div class="topbar-right">

        <!-- Semantic search over the user's documents (WorkspaceWebController /search) -->
        <form class="search-box" th:action="@{/search}" method="get" role="search">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input type="search"
                   id="globalSearch"
                   name="q"
                   maxlength="500"
                   th:value="${query}"
                   placeholder="Search your documents..."
                   aria-label="Search your documents">
            <span class="search-shortcut" aria-hidden="true">⌘ K</span>
        </form>

        <div class="user-profile">
            <div class="user-avatar"
                 th:text="${avatarInitial}">
                U
            </div>

            <div class="user-info">
                <strong th:text="${username}">Username</strong>
                <span>Personal workspace</span>
            </div>
        </div>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-button">
                Logout ↗
            </button>
        </form>

    </div>

    <!-- Ctrl+K / ⌘K focuses the search box on every page -->
    <script>
        document.addEventListener("keydown", (event) => {
            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
                const search = document.getElementById("globalSearch");
                if (search) {
                    event.preventDefault();
                    search.focus();
                    search.select();
                }
            }
        });
    </script>

</header>
