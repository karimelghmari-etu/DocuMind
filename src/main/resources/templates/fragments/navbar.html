<header class="topbar" th:fragment="navbar">

    <div class="topbar-left">
        <div class="breadcrumb">
            <strong th:text="${currentPage}">Dashboard</strong>
        </div>
    </div>

    <div class="topbar-right">

        <!-- Semantic search over the user's documents (WorkspaceWebController /search) -->
        <form class="search-box" th:action="@{/search}" method="get" role="search">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input type="search"
                   id="globalSearch"
                   name="q"
                   maxlength="500"
                   th:value="${query}"
                   placeholder="Search your documents"
                   aria-label="Search your documents">
            <kbd class="search-shortcut" aria-hidden="true">Ctrl K</kbd>
        </form>

        <button th:replace="~{fragments/head :: theme-toggle}"></button>

        <div class="user-profile">
            <div class="user-avatar" aria-hidden="true" th:text="${avatarInitial}">U</div>
            <div class="user-info">
                <strong th:text="${username}">Username</strong>
            </div>
        </div>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-button">Log out</button>
        </form>

    </div>

    <!-- Ctrl+K / ⌘K focuses the search box on every page; on a Mac the hint says ⌘ K. -->
    <script>
        (function () {
            if (/Mac|iPhone|iPad/.test(navigator.platform)) {
                document.querySelectorAll(".search-shortcut").forEach(function (hint) {
                    hint.textContent = "⌘ K";
                });
            }
            document.addEventListener("keydown", function (event) {
                if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
                    var search = document.getElementById("globalSearch");
                    if (search) {
                        event.preventDefault();
                        search.focus();
                        search.select();
                    }
                }
            });
        })();
    </script>

</header>
