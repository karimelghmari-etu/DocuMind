<aside class="sidebar" th:fragment="sidebar">

    <a class="sidebar-brand plain-link" th:href="@{/dashboard}">
        <div class="brand-icon" aria-hidden="true">D</div>
        <span>DocuMind</span>
    </a>

    <nav class="sidebar-section" aria-label="Main">
        <div class="sidebar-nav">

            <a th:href="@{/dashboard}" class="nav-link"
               th:classappend="${activePage == 'dashboard'} ? ' active' : ''"
               th:attr="aria-current=${activePage == 'dashboard'} ? 'page' : null">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
                        <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
                    </svg>
                </span>
                <span>Dashboard</span>
            </a>

            <a th:href="@{/documents}" class="nav-link"
               th:classappend="${activePage == 'documents'} ? ' active' : ''"
               th:attr="aria-current=${activePage == 'documents'} ? 'page' : null">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 3.5H7A1.5 1.5 0 0 0 5.5 5v14A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V8L14 3.5Z"/>
                        <path d="M14 3.5V8h4.5M9 13h6M9 16.5h6"/>
                    </svg>
                </span>
                <span>Documents</span>
            </a>

            <a th:href="@{/collections}" class="nav-link"
               th:classappend="${activePage == 'collections'} ? ' active' : ''"
               th:attr="aria-current=${activePage == 'collections'} ? 'page' : null">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l2 2h8a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5v-10Z"/>
                    </svg>
                </span>
                <span>Collections</span>
            </a>

            <a th:href="@{/assistant}" class="nav-link"
               th:classappend="${activePage == 'assistant'} ? ' active' : ''"
               th:attr="aria-current=${activePage == 'assistant'} ? 'page' : null">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 14.5a2 2 0 0 1-2 2H9l-4.5 3.5V6.5a2 2 0 0 1 2-2H18a2 2 0 0 1 2 2v8Z"/>
                        <path d="M9 9.5h6M9 12.5h3.5"/>
                    </svg>
                </span>
                <span>Assistant</span>
            </a>

            <a th:href="@{/history}" class="nav-link"
               th:classappend="${activePage == 'history'} ? ' active' : ''"
               th:attr="aria-current=${activePage == 'history'} ? 'page' : null">
                <span class="nav-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
                    </svg>
                </span>
                <span>History</span>
            </a>

        </div>
    </nav>

    <!-- The user's collections, from SidebarModelAdvice. -->
    <section class="sidebar-collections" th:if="${sidebarCollections != null}" aria-labelledby="sidebarCollectionsTitle">
        <div class="sidebar-collections-head">
            <h2 id="sidebarCollectionsTitle">Collections</h2>
            <a th:href="@{/collections}" class="sidebar-add" title="New collection" aria-label="New collection">+</a>
        </div>
        <a th:each="collection : ${sidebarCollections}"
           th:href="@{/collections/{id}(id=${collection.id})}"
           class="sidebar-collection"
           th:classappend="${collection != null and activeCollectionId != null and collection.id == activeCollectionId} ? ' active' : ''">
            <span class="sidebar-collection-name" th:text="${collection.name}">Collection</span>
            <span class="sidebar-collection-count" th:text="${collection.documentCount}">0</span>
        </a>
        <p class="sidebar-empty" th:if="${#lists.isEmpty(sidebarCollections)}">
            Group documents by course or project.
        </p>
    </section>

    <div class="sidebar-bottom">
        <a th:href="@{/settings}" class="nav-link"
           th:classappend="${activePage == 'settings'} ? ' active' : ''"
           th:attr="aria-current=${activePage == 'settings'} ? 'page' : null">
            <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
                </svg>
            </span>
            <span>Settings</span>
        </a>
    </div>

</aside>
