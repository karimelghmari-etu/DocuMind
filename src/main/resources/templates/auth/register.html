
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create account | DocuMind</title>

    <th:block th:replace="~{fragments/head :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="auth-page">

    <section th:replace="~{fragments/auth-brand :: brand}"></section>


    <!-- RIGHT REGISTER FORM -->
    <main class="auth-main">

        <div class="auth-theme"><button th:replace="~{fragments/head :: theme-toggle}"></button></div>

        <div class="auth-container">

            <div class="auth-heading">
                <h2>Create an account</h2>
            </div>

            <form class="auth-form"
                  th:action="@{/register}"
                  th:object="${registerRequest}"
                  method="post">

                <!-- Username -->
                <div class="form-group">

                    <label class="form-label" for="username">
                        Username
                    </label>

                    <input
                            type="text"
                            id="username"
                            th:field="*{username}"
                            class="form-control"
                            placeholder="Choose a username"
                            autocomplete="username"
                            required>

                    <p class="auth-error"
                       th:if="${#fields.hasErrors('username')}"
                       th:errors="*{username}">
                    </p>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label class="form-label" for="email">
                        Email address
                    </label>

                    <input
                            type="email"
                            id="email"
                            th:field="*{email}"
                            class="form-control"
                            placeholder="name@example.com"
                            autocomplete="email"
                            required>

                    <p class="auth-error"
                       th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}">
                    </p>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label class="form-label" for="password">
                        Password
                    </label>

                    <input
                            type="password"
                            id="password"
                            th:field="*{password}"
                            class="form-control"
                            placeholder="At least 8 characters"
                            autocomplete="new-password"
                            minlength="8"
                            required>

                    <p class="auth-error"
                       th:if="${#fields.hasErrors('password')}"
                       th:errors="*{password}">
                    </p>

                </div>


                <!-- CSRF -->
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">


                <button type="submit" class="btn btn-primary">
                    Create account
                </button>

            </form>


            <div class="auth-footer">
                Already have an account?
                <a th:href="@{/login}">Sign in</a>
            </div>

        </div>

    </main>

</div>

</body>
</html>
