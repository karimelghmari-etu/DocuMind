
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in | DocuMind</title>

    <th:block th:replace="~{fragments/head :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>

<div class="auth-page">

    <section th:replace="~{fragments/auth-brand :: brand}"></section>


    <!-- RIGHT LOGIN FORM -->
    <main class="auth-main">

        <div class="auth-theme"><button th:replace="~{fragments/head :: theme-toggle}"></button></div>

        <div class="auth-container">

            <div class="auth-heading">
                <h2>Sign in</h2>
            </div>

            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password.
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                You have been logged out successfully.
            </div>

            <div th:if="${param.registered}" class="alert alert-success">
                Account created successfully. You can now sign in.
            </div>

            <form class="auth-form"
                  th:action="@{/login}"
                  method="post">

                <div class="form-group">

                    <label class="form-label" for="username">
                        Username
                    </label>

                    <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            
                            autocomplete="username"
                            required>

                </div>


                <div class="form-group">

                    <label class="form-label" for="password">
                        Password
                    </label>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            
                            autocomplete="current-password"
                            required>

                </div>

                <button type="submit" class="btn btn-primary">
                    Sign in
                </button>

            </form>

            <div class="auth-footer">
                New to DocuMind? <a th:href="@{/register}">Create an account</a>
            </div>

        </div>

    </main>

</div>

</body>
</html>
