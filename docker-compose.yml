services:
  postgres:
    image: postgres:17
    container_name: documind-postgres
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - documind-pgdata:/var/lib/postgresql/data

volumes:
  documind-pgdata: